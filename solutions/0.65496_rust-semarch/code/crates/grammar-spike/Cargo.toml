[package]
name = "grammar-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Temporary compile-spike crate: loads every Tier-A grammar and parses a fixture
# of each language. Result is recorded in docs/adr/0002-grammar-pin.md, after
# which this crate may be dropped from default-members builds.

[dependencies]
tree-sitter = "0.27.1"
tree-sitter-java = "0.23.5"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-c-sharp = "0.23.5"
