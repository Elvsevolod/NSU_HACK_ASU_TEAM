spring.application.name=${APP_NAME:order-service}
server.port=${SERVER_PORT:8083}

# H2
spring.datasource.url=${DB_URL:jdbc:h2:mem:orderdb}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# H2 Console
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=${H2_CONSOLE_PATH:/h2-console}

# Product Service
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8080/api/products}

# Logging
logging.level.com.shoppingcart=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
