server.port=8083

spring.application.name=doctor-service

spring.datasource.url=jdbc:mysql://mysql:3306/hospital_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ----------------------------------------------------
# Resilience4j Circuit Breaker (patientService)
# Used by DoctorServiceImpl.getDoctorWithPatient(...)
# ----------------------------------------------------
resilience4j.circuitbreaker.instances.patientService.register-health-indicator=true
resilience4j.circuitbreaker.instances.patientService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.patientService.sliding-window-size=10
resilience4j.circuitbreaker.instances.patientService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.patientService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.patientService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.patientService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.patientService.automatic-transition-from-open-to-half-open-enabled=true

# Expose actuator endpoints to observe circuit-breaker state
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true